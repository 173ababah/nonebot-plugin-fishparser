[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "nonebot-plugin-fishparser"
version = "0.1.0"
description = "零 LLM 开销的链接解析：B站/抖音/小红书/油管/推特… 贴链接就出标题+直链"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "173ababah" }]
requires-python = ">=3.9"
dependencies = ["nonebot2>=2.0.0", "nonebot-adapter-onebot>=2.2.0", "httpx>=0.24"]

[project.optional-dependencies]
ytdlp = ["yt-dlp>=2024.1.0"]

[project.urls]
Homepage = "https://github.com/173ababah/nonebot-plugin-fishparser"
Repository = "https://github.com/173ababah/nonebot-plugin-fishparser"

[tool.nonebot]
adapters = [{ name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }]
plugin_name = "nonebot-plugin-fishparser"
plugins = ["nonebot_plugin_fishparser"]

[tool.pdm.build]
includes = ["nonebot_plugin_fishparser"]
